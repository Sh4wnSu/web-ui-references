<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Capsule Controls</title><link rel="stylesheet" href="../../design-tokens/capsule.css"><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#f5f5f7;color:#1d1d1f;font:14px system-ui}main{max-width:900px;margin:auto}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}article{padding:20px;background:white;border-radius:20px;min-width:0}h2{font-size:16px}.track{position:relative;isolation:isolate;display:flex;padding:4px;background:var(--capsule-track);border-radius:999px;overflow:hidden;touch-action:pan-y}.thumb{position:absolute;top:4px;bottom:4px;left:0;background:var(--capsule-thumb);border-radius:inherit;box-shadow:var(--capsule-shadow);z-index:-1;pointer-events:none}button{border:0;background:none;color:inherit;font:inherit;cursor:pointer;flex:1;min-width:0;padding:10px 8px;white-space:nowrap;position:relative;border-radius:inherit}button[aria-checked=true]{font-weight:600}button:focus-visible{outline:2px solid #0071e3;outline-offset:-2px}button:active span{display:inline-block;transform:scale(var(--capsule-press-scale))}.classic{border-radius:9px}.floating{background:white;border:1px solid #ddd;box-shadow:0 3px 12px #0001}.floating .thumb{background:#e9e9ee;box-shadow:none}.accent .thumb{background:#007aff;box-shadow:none}.accent button[aria-checked=true]{color:white}.glassbg{background:linear-gradient(130deg,#b7cbed,#e6c9d9);padding:12px;border-radius:16px}.glass{background:#ffffff44;border:1px solid #ffffff99;backdrop-filter:blur(20px)}.glass .thumb{background:#ffffff99;border:1px solid #fff9;box-shadow:inset 0 1px 2px white,0 3px 8px #3452}.dark{background:#29292d;color:#eee}.dark .thumb{background:#505057}.muted{background:#eeeef2}.muted .thumb{background:#d5dfef;box-shadow:none}.compact button{font-size:11px;padding:6px 3px}.outline{background:transparent;border:1px solid #d5d5da}.outline .thumb{border:1px solid #ddd}.adaptive button{flex:1 1 auto}.drag{cursor:grab}.drag.dragging{cursor:grabbing}.drag.dragging button{cursor:grabbing}select{font:inherit;padding:8px;border-radius:8px}small{color:#666}@media(prefers-reduced-transparency:reduce){.glass,.glass .thumb{background:white;backdrop-filter:none}}@media(prefers-reduced-motion:reduce){button:active span{transform:none}}</style><main><h1>Apple Capsule Controls</h1><p>独立滑块 · 物理弹簧 · 自适应宽度 · 拖拽吸附</p><label>动画 <select id="mode"><option value="spring">Spring 500 / 40 / 1</option><option value="css">CSS Bézier</option><option value="none">无动画</option></select></label><h2>八种样式</h2><div id="gallery" class="gallery"></div><h2>专项交互</h2><div id="special" class="gallery"></div></main><script>
const styles=[['iOS 经典','classic',['Day','Week','Month']],['悬浮胶囊','floating',['Overview','Models','Usage']],['系统强调色','accent',['Daily','Weekly','Monthly']],['Liquid Glass','glass',['Explore','Library','Profile']],['深色','dark',['Overview','Models','Usage']],['环境染色','muted',['Summary','Activity','Costs']],['紧凑工具栏','compact',['Input','Output','Total']],['极简描边','outline',['Auto','Light','Dark']]];
function card([name,cls,items]){return '<article><h2>'+name+'</h2><div class="'+(cls==='glass'?'glassbg':'')+'"><div class="track '+cls+'" role="radiogroup" aria-label="'+name+'"><div class="thumb" aria-hidden="true"></div>'+items.map((s,i)=>'<button role="radio" aria-checked="'+(i===0)+'" tabindex="'+(i===0?0:-1)+'"><span>'+s+'</span></button>').join('')+'</div></div></article>'}
document.querySelector('#gallery').innerHTML=styles.map(card).join('');document.querySelector('#special').innerHTML=[['不等宽滑块','adaptive',['Day','Last 7 days','All time']],['拖拽选择','drag',['Low','Medium','High']]].map(card).join('');
const mode=document.querySelector('#mode'),reduce=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
document.querySelectorAll('.track').forEach(t=>{const thumb=t.querySelector('.thumb'),bs=[...t.querySelectorAll('button')];let index=0,x=0,w=0,vx=0,vw=0,frame=0,gesture=null,suppress=false;function target(i=index){return [bs[i].offsetLeft,bs[i].offsetWidth]}function draw(){thumb.style.transform='translateX('+x+'px)';thumb.style.width=Math.max(0,w)+'px'}function move(immediate=false){cancelAnimationFrame(frame);let [tx,tw]=target();if(mode.value==='css'&&!immediate&&!reduce()){let r=thumb.getBoundingClientRect(),base=t.getBoundingClientRect();x=r.left-base.left-t.clientLeft;w=r.width;thumb.style.transition='none';draw();thumb.getBoundingClientRect();thumb.style.transition='transform var(--capsule-duration) var(--capsule-ease),width var(--capsule-duration) var(--capsule-ease)';x=tx;w=tw;vx=vw=0;draw();return}if(thumb.style.transition&&thumb.style.transition!=='none'){let r=thumb.getBoundingClientRect(),base=t.getBoundingClientRect();x=r.left-base.left-t.clientLeft;w=r.width}thumb.style.transition='none';if(immediate||reduce()||mode.value==='none'){x=tx;w=tw;vx=vw=0;draw();return}let last=performance.now();function tick(now){let dt=Math.min(.032,(now-last)/1000);last=now;let n=Math.max(1,Math.ceil(dt/.002)),h=dt/n;for(let j=0;j<n;j++){vx+=(500*(tx-x)-40*vx)*h;vw+=(500*(tw-w)-40*vw)*h;x+=vx*h;w+=vw*h}if(Math.abs(tx-x)+Math.abs(tw-w)<.1&&Math.abs(vx)+Math.abs(vw)<1){x=tx;w=tw;vx=vw=0;draw();return}draw();frame=requestAnimationFrame(tick)}frame=requestAnimationFrame(tick)}
function select(i,focus=false){index=i;bs.forEach((b,j)=>{b.setAttribute('aria-checked',String(i===j));b.tabIndex=i===j?0:-1});if(focus)bs[i].focus();move()}
bs.forEach((b,i)=>b.onclick=()=>{if(!suppress)select(i)});t.onkeydown=e=>{let i=bs.indexOf(document.activeElement);if(i<0)return;let j;if(['ArrowRight','ArrowDown'].includes(e.key))j=(i+1)%bs.length;else if(['ArrowLeft','ArrowUp'].includes(e.key))j=(i+bs.length-1)%bs.length;else if(e.key==='Home')j=0;else if(e.key==='End')j=bs.length-1;else return;e.preventDefault();select(j,true)};
if(t.classList.contains('drag')){t.onpointerdown=e=>{if(!e.isPrimary||e.button!==0)return;gesture={id:e.pointerId,start:e.clientX,drag:false};suppress=false};t.onpointermove=e=>{if(!gesture||gesture.id!==e.pointerId)return;if(!gesture.drag&&Math.abs(e.clientX-gesture.start)<6)return;if(!gesture.drag){gesture.drag=true;t.setPointerCapture(e.pointerId);cancelAnimationFrame(frame);thumb.style.transition='none';vx=vw=0;t.classList.add('dragging')}let r=t.getBoundingClientRect();x=Math.max(4,Math.min(t.clientWidth-4-w,e.clientX-r.left-w/2));draw()};function finish(e,cancel){if(!gesture||gesture.id!==e.pointerId)return;if(gesture.drag){suppress=true;t.classList.remove('dragging');let center=x+w/2,i=index;if(!cancel)i=bs.reduce((best,b,j)=>Math.abs(b.offsetLeft+b.offsetWidth/2-center)<Math.abs(bs[best].offsetLeft+bs[best].offsetWidth/2-center)?j:best,0);select(i);setTimeout(()=>suppress=false,0)}gesture=null}t.onpointerup=e=>finish(e,false);t.onpointercancel=e=>finish(e,true);t.onlostpointercapture=e=>finish(e,true)}
new ResizeObserver(()=>{if(!gesture?.drag)move(true)}).observe(t);mode.addEventListener('change',()=>move(true));move(true)});
</script></html>
