<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spring Lab</title><link rel="stylesheet" href="../../design-tokens/apple.css"><link rel="stylesheet" href="../../design-tokens/spring.css"><style>*{box-sizing:border-box}body{font:14px system-ui;background:var(--bg);color:var(--text-primary);padding:20px}main{max-width:850px;margin:auto}button,select,input{font:inherit}button,select{padding:9px;border:1px solid #aaa5;border-radius:10px;background:var(--surface);color:inherit}label{display:block;margin:10px 0}.scene{display:flex;gap:10px;background:#e8e8ed;padding:10px;border-radius:20px;overflow:hidden;color:#1d1d1f}aside{width:240px;flex:none;overflow:hidden;background:#ffffffaa;border-radius:14px;padding:10px}.item{display:flex;align-items:center;gap:10px;height:36px;white-space:nowrap;padding:0 8px;border-radius:8px}.item:first-child{background:#dce7f9}.icon{width:20px;flex:none;text-align:center}.label{display:inline-block;white-space:nowrap}.content{flex:1;min-width:0;background:white;padding:16px;border-radius:14px;overflow:hidden}.metrics{display:flex;flex-wrap:wrap;gap:8px}.metric{background:#f5f5f7;padding:12px;border-radius:12px;flex:1;min-width:90px}.metric strong{display:block;font-size:22px}svg{width:100%;max-height:160px} @media(max-width:520px){aside{width:150px}.scene{gap:6px;padding:6px}.content{padding:8px}}</style><main><h1>Apple-inspired Spring Lab</h1><p>切换预设并快速重复点击，观察速度继承和回弹。参数为自主 Web 参考。</p><button id="toggle" aria-expanded="true" aria-controls="side">折叠</button> <select id="preset" aria-label="Spring preset"><option>professional</option><option>smooth</option><option>snappy</option><option>soft</option><option>bouncy</option></select><label><input type="checkbox" id="slow"> 慢速演示</label><div class="scene"><aside id="side"></aside><section class="content"><h2>Overview</h2><div class="metrics"><div class="metric">Requests<strong>128K</strong></div><div class="metric">Success<strong>99.8%</strong></div></div><svg viewBox="0 0 240 90" role="img" aria-label="模拟趋势"><path d="M0 70 L20 58 40 62 60 43 80 49 100 33 120 40 140 20 160 30 180 12 200 25 220 6 240 12" stroke="#6389c6" stroke-width="2" fill="none"/></svg></section></div><p id="stats"></p><svg viewBox="0 0 340 125" role="img" aria-label="弹簧响应曲线"><path d="M5 25 H335 M5 110 H335" stroke="currentColor" opacity=".2" stroke-dasharray="4 4"/><path id="curve" fill="none" stroke="#6389c6" stroke-width="2"/></svg></main><script>
const $=id=>document.getElementById(id),presets={smooth:[300,35,1],professional:[380,38,1],snappy:[450,34,1],soft:[220,27,1],bouncy:[300,16,1]};$('side').innerHTML=['Overview','Analytics','Models','Activity','Settings'].map((n,i)=>'<div class="item"><span class="icon" aria-hidden="true">'+['▦','▥','◇','⌁','⚙'][i]+'</span><span class="label">'+n+'</span></div>').join('');const labels=[...document.querySelectorAll('.label')],wide=()=>matchMedia('(max-width:520px)').matches?150:240;let x=wide(),v=0,open=true,frame=0;const reduce=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
function draw(){ $('side').style.width=Math.max(44,x)+'px';let [k,c,m]=presets[$('preset').value];$('stats').textContent='Width '+x.toFixed(1)+' px · velocity '+v.toFixed(1)+' px/s · damping ratio '+(c/(2*Math.sqrt(k*m))).toFixed(2)}
function curve(){let [k,c,m]=presets[$('preset').value],p=0,u=0,points=[];for(let i=0;i<=330;i++){points.push((5+i)+','+(110-p*85));let dt=.0025;u+=((k*(1-p)-c*u)/m)*dt;p+=u*dt}$('curve').setAttribute('d','M'+points.join(' L'))}
function animateLabels(){labels.forEach((e,i)=>{let opacity=getComputedStyle(e).opacity,transform=getComputedStyle(e).transform,filter=getComputedStyle(e).filter;e.getAnimations().forEach(a=>a.cancel());let scale=$('slow').checked?3:1;e.animate([{opacity,transform,filter},{opacity:open?1:0,transform:'translateX('+(open?0:4)+'px)',filter:'blur('+(open?0:2)+'px)'}],{duration:reduce()?0:140*scale,delay:reduce()?0:open?(140+i*20)*scale:0,fill:'both',easing:'ease-out'})})}
function run(){cancelAnimationFrame(frame);let last=performance.now();function tick(now){let target=open?wide():60,[k,c,m]=presets[$('preset').value];if(reduce()){x=target;v=0;draw();return}let dt=Math.min(.032,(now-last)/1000)/($('slow').checked?3:1);last=now;let steps=Math.max(1,Math.ceil(dt/.002));for(let i=0;i<steps;i++){v+=((k*(target-x)-c*v)/m)*dt/steps;x+=v*dt/steps}if(Math.abs(target-x)<.1&&Math.abs(v)<1){x=target;v=0;draw();return}draw();frame=requestAnimationFrame(tick)}frame=requestAnimationFrame(tick)}
$('toggle').onclick=()=>{open=!open;$('toggle').textContent=open?'折叠':'展开';$('toggle').setAttribute('aria-expanded',String(open));animateLabels();run()};$('preset').onchange=()=>{curve();run()};window.addEventListener('resize',()=>{run()});curve();draw();
</script></html>
