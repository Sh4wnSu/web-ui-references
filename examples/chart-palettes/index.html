<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chart palettes</title><link rel="stylesheet" href="../../design-tokens/apple.css"><link rel="stylesheet" href="../../design-tokens/chart-palettes.css"><style>body{font:16px system-ui;background:var(--bg);color:var(--text-primary);padding:24px}main{max-width:900px;margin:auto}section{background:var(--surface);border-radius:24px;padding:24px;margin:16px 0}.swatches{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:12px}.chip{height:52px;border-radius:10px}small{display:block;overflow-wrap:anywhere}button{font:inherit;padding:10px 16px}svg{width:100%;max-width:420px;height:auto}</style><main><h1>Chart palettes A / B / C</h1><button id="theme">切换深浅色</button><div id="gallery"></div></main><script>const groups=[{"n":"A · Apple System Colors","id":"system","v":["#007AFF","#34C759","#FF9500","#FF3B30","#AF52DE","#5856D6","#5AC8FA","#FFCC00"]},{"n":"B · Muted Apple Palette","id":"muted","v":["#6389C6","#68A68C","#D5A16B","#CC7882","#9C85BE","#7D8DBB","#69AAB5","#CCB66C"]},{"n":"C · Monochromatic 245°","id":"mono-245","v":["oklch(0.35 0.08 245)","oklch(0.45 0.08 245)","oklch(0.55 0.08 245)","oklch(0.65 0.08 245)","oklch(0.75 0.08 245)","oklch(0.85 0.08 245)"]},{"n":"C · Monochromatic 155°","id":"mono-155","v":["oklch(0.35 0.08 155)","oklch(0.45 0.08 155)","oklch(0.55 0.08 155)","oklch(0.65 0.08 155)","oklch(0.75 0.08 155)","oklch(0.85 0.08 155)"]},{"n":"C · Monochromatic 300°","id":"mono-300","v":["oklch(0.35 0.08 300)","oklch(0.45 0.08 300)","oklch(0.55 0.08 300)","oklch(0.65 0.08 300)","oklch(0.75 0.08 300)","oklch(0.85 0.08 300)"]},{"n":"C · Monochromatic 50°","id":"mono-50","v":["oklch(0.35 0.08 50)","oklch(0.45 0.08 50)","oklch(0.55 0.08 50)","oklch(0.65 0.08 50)","oklch(0.75 0.08 50)","oklch(0.85 0.08 50)"]}];document.querySelector('#gallery').innerHTML=groups.map(g=>'<section data-chart-palette="'+g.id+'"><h2>'+g.n+'</h2><div class="swatches">'+g.v.map((c,i)=>'<div><div class="chip" style="background:var(--chart-series-'+(i+1)+')"></div><small>'+c+'</small></div>').join('')+'</div><svg viewBox="0 0 320 100" role="img" aria-label="配色柱状图示例">'+g.v.map((c,i)=>'<rect x="'+(i*320/g.v.length+4)+'" y="'+(90-(30+i*7))+'" width="'+(320/g.v.length-8)+'" height="'+(30+i*7)+'" rx="4" fill="var(--chart-series-'+(i+1)+')"/>').join('')+'</svg></section>').join('');document.querySelector('#theme').onclick=()=>document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';</script></html>
