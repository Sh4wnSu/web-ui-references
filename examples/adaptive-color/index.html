<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adaptive Color Lab</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;font:16px/1.5 system-ui,sans-serif;background:#f5f5f7;color:#1d1d1f}main{max-width:960px;margin:auto}h1{letter-spacing:-.04em} .layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}.controls,.player{border-radius:28px;padding:24px}.controls{background:white}.player{position:relative;overflow:hidden;color:white;min-height:460px;isolation:isolate;display:flex;flex-direction:column;justify-content:center;gap:16px}.player.light{color:#1d1d1f}.ambient{position:absolute;inset:0;z-index:-1;transition:opacity .7s}.cover{width:75%;aspect-ratio:1;object-fit:cover;border-radius:16px;align-self:center;box-shadow:0 12px 32px #0003}.glass{padding:16px;border-radius:24px;background:#ffffff22;backdrop-filter:blur(24px) saturate(125%);border:1px solid #ffffff40;text-align:center}.light .glass{background:#ffffff88}label{display:block;margin:16px 0}input[type=range]{width:100%}button,select,input{font:inherit}button{border:0;border-radius:20px;padding:10px 16px;background:#0071e3;color:white;cursor:pointer}.swatches{display:flex;gap:6px;flex-wrap:wrap}.swatches span{width:44px;height:44px;border-radius:10px;border:1px solid #0002}pre{white-space:pre-wrap;font-size:12px}canvas{display:none}@media(max-width:650px){.layout{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){.ambient{transition:none}}
</style><main><h1>Adaptive Color Lab</h1><p>上传本地图片，提取实际像素色板并生成 Apple Music 风格背景。图片不会上传服务器。</p><div class="layout"><section class="controls"><label>封面图片 <input id="file" type="file" accept="image/*"></label><label>主题 <select id="mode"><option value="dark">深色</option><option value="light">浅色</option></select></label><label>背景色度上限 <output id="co"></output><input id="chroma" type="range" min="0" max=".16" step=".005" value=".075"></label><label>光晕明度 <output id="lo"></output><input id="lightness" type="range" min=".28" max=".58" step=".01" value=".46"></label><label>玻璃不透明度 <input id="opacity" type="range" min="10" max="70" value="20"></label><h3>提取色板</h3><div id="raw" class="swatches"></div><h3>映射色板</h3><div id="mapped" class="swatches"></div><pre id="tokens"></pre><p id="status" role="status"></p></section><section class="player" id="player"><div class="ambient" id="bg"></div><img class="cover" id="cover" alt="示例封面"><div><strong style="font-size:24px">Ambient Colours</strong><br>Design Sessions</div><progress value="40" max="100" style="width:100%"></progress><div class="glass" id="glass">♡　　Ⅱ　　•••</div></section></div><canvas id="canvas" width="64" height="64"></canvas></main>
<script>
const $=id=>document.getElementById(id),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lin=v=>v<=.04045?v/12.92:((v+.055)/1.055)**2.4;
const gam=v=>v<=.0031308?12.92*v:1.055*v**(1/2.4)-.055;
function lab(r,g,b){r=lin(r);g=lin(g);b=lin(b);let l=Math.cbrt(.4122214708*r+.5363325363*g+.0514459929*b),m=Math.cbrt(.2119034982*r+.6806995451*g+.1073969566*b),s=Math.cbrt(.0883024619*r+.2817188376*g+.6299787005*b);return [.2104542553*l+.793617785*m-.0040720468*s,1.9779984951*l-2.428592205*m+.4505937099*s,.0259040371*l+.7827717662*m-.808675766*s]}
function rgb([L,a,b]){let l=(L+.3963377774*a+.2158037573*b)**3,m=(L-.1055613458*a-.0638541728*b)**3,s=(L-.0894841775*a-1.291485548*b)**3;return [4.0767416621*l-3.3077115913*m+.2309699292*s,-1.2684380046*l+2.6097574011*m-.3413193965*s,-.0041960863*l-.7034186147*m+1.707614701*s]}
function hex(v){return '#'+rgb(v).map(x=>Math.round(clamp(gam(x),0,1)*255).toString(16).padStart(2,'0')).join('')}
function map(v,L,max){let C=Math.hypot(v[1],v[2]),h=Math.atan2(v[2],v[1]),c=Math.min(C*.45,max);if(C<.008)c=0;let out;for(let i=0;i<32;i++){out=[L,c*Math.cos(h),c*Math.sin(h)];if(rgb(out).every(x=>x>=-1e-7&&x<=1.0000001))break;c*=.85}return hex(out)}
const dist=(a,b)=>a.reduce((s,x,i)=>s+(x-b[i])**2,0);
let palette=[];
function extract(img){let ctx=$('canvas').getContext('2d',{willReadFrequently:true});ctx.clearRect(0,0,64,64);ctx.drawImage(img,0,0,64,64);let d=ctx.getImageData(0,0,64,64).data,pts=[];for(let i=0;i<d.length;i+=4)if(d[i+3]>127)pts.push(lab(d[i]/255,d[i+1]/255,d[i+2]/255));if(!pts.length)throw Error('没有可用像素');let centers=[pts[Math.floor(pts.length/2)]];while(centers.length<6){let best=pts[0],max=-1;for(const p of pts){let v=Math.min(...centers.map(c=>dist(p,c)));if(v>max){max=v;best=p}}if(max<1e-8)break;centers.push(best)}let counts=[];for(let iter=0;iter<15;iter++){let sums=centers.map(()=>[0,0,0]);counts=centers.map(()=>0);for(const p of pts){let j=0;for(let k=1;k<centers.length;k++)if(dist(p,centers[k])<dist(p,centers[j]))j=k;counts[j]++;p.forEach((v,k)=>sums[j][k]+=v)}centers=centers.map((c,j)=>counts[j]?sums[j].map(v=>v/counts[j]):c)}let ranked=centers.map((v,i)=>({v,w:counts[i]/pts.length})).filter(x=>x.w>0).sort((a,b)=>score(b)-score(a));function score(x){let c=Math.hypot(x.v[1],x.v[2]);return x.w**.65*(.25+Math.min(c/.1,1))*(.6+.4*(1-Math.abs(x.v[0]-.5)*2))}let chosen=[];for(const x of ranked)if(chosen.every(y=>dist(x.v,y)>.0025))chosen.push(x.v);return chosen}
function render(){if(!palette.length)return;let light=$('mode').value==='light',C=+$('chroma').value,L=+$('lightness').value;$('co').value=C.toFixed(3);$('lo').value=L.toFixed(2);let colors=Array.from({length:3},(_,i)=>map(palette[i%palette.length],light?.92:L,C*(light?.45:1))),base=map(palette[0],light?.97:.22,C*.4);$('player').classList.toggle('light',light);let bg=$('bg');bg.style.background='radial-gradient(ellipse at 15% 10%,'+colors[0]+',transparent 70%),radial-gradient(ellipse at 90% 15%,'+colors[1]+',transparent 70%),radial-gradient(ellipse at 55% 100%,'+colors[2]+',transparent 75%),'+base;$('glass').style.background='rgba(255,255,255,'+$('opacity').value/100+')';for(const [id,arr] of [['raw',palette.map(hex)],['mapped',colors]]){$(id).replaceChildren(...arr.map(c=>{let e=document.createElement('span');e.style.background=c;e.title=c;return e}))}$('tokens').textContent='--base: '+base+';\n'+colors.map((c,i)=>'--color-'+(i+1)+': '+c+';').join('\n')}
async function load(url){let img=$('cover');img.src=url;await img.decode();palette=extract(img);render();$('status').textContent='已提取 '+palette.length+' 种代表色。'}
$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;let url=URL.createObjectURL(f);try{await load(url)}catch(err){$('status').textContent=err.message}finally{URL.revokeObjectURL(url)}};['mode','chroma','lightness','opacity'].forEach(id=>$(id).oninput=render);
load('data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256"><rect width="256" height="256" fill="#6553b9"/><circle cx="170" cy="85" r="76" fill="#d284ae"/><path d="M0 256V160Q80 30 150 180T256 130V256Z" fill="#456baa"/></svg>')).catch(e=>$('status').textContent=e.message);
</script></html>
