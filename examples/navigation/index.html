<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apple Navigation Gallery</title><link rel="stylesheet" href="../../design-tokens/apple.css"><link rel="stylesheet" href="../../design-tokens/navigation.css"><style>
*{box-sizing:border-box}body{margin:0;padding:24px;font:14px/1.5 var(--font-sans);background:var(--bg);color:var(--text-primary)}main{max-width:1200px;margin:auto}h1,h2{letter-spacing:-.03em}h3{font-size:15px}button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}button:focus-visible{outline:2px solid #0071e3;outline-offset:2px}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px}.card{background:var(--surface);padding:16px;border-radius:20px;min-width:0}.scene{background:#f5f5f7;color:#1d1d1f;padding:12px;border-radius:18px;min-width:0}.side{width:100%;max-width:240px;background:#e9e9ed;border-radius:10px;padding:10px;transition:width var(--nav-duration)}.brand{font-weight:650;padding:8px;white-space:nowrap}.group{font-size:11px;color:#6e6e73;margin:18px 8px 4px}.navitem{display:flex;align-items:center;gap:8px;width:100%;min-height:36px;padding:6px 9px;text-align:left;border-radius:8px;white-space:nowrap}.navitem svg,.tab svg{width:18px;height:18px;flex:none}.navitem:hover{background:#8881}.navitem[aria-pressed=true]{background:#d4d4da;color:#005bb8;font-weight:600}.floating .side{background:white;border-radius:24px;box-shadow:0 4px 18px #0001}.floating .navitem[aria-pressed=true]{background:#e8edf6}.glass{background:radial-gradient(ellipse at top left,#b6c8eb,transparent 75%),radial-gradient(ellipse at bottom right,#d8c0dd,transparent 75%),#e9eaf1}.glass .side,.glass .tabs{background:#ffffff66;border:1px solid #ffffffa0;backdrop-filter:blur(var(--nav-blur));border-radius:24px}.glass .navitem[aria-pressed=true]{background:#ffffffbb}.dark{background:#161618;color:#ededf0}.dark .side{background:#242426}.dark .group{color:#b0b0b5}.dark .navitem[aria-pressed=true]{background:#3a3a3e;color:#80b5ff}.minimal .side{background:white}.minimal .navitem[aria-pressed=true]{background:#e7f0ff}.icons .side,.collapsed .side{width:60px}.icons .navitem,.collapsed .navitem{justify-content:center}.icons .label,.icons .group,.icons .brandname,.collapsed .label,.collapsed .group,.collapsed .brandname{display:none}.tabs{display:flex;gap:4px;padding:4px;max-width:100%;overflow:auto;align-items:center}.tab{white-space:nowrap;min-height:32px;padding:6px 12px;border-radius:8px;position:relative;flex:1}.segmented .tabs,.compact .tabs{background:#e4e4e9;border-radius:10px}.segmented .tab[aria-selected=true],.compact .tab[aria-selected=true]{background:white;box-shadow:var(--tab-shadow)}.pill .tabs{background:white;border-radius:999px;box-shadow:var(--tab-shadow)}.pill .tab,.glass .tab{border-radius:999px}.pill .tab[aria-selected=true]{background:#e8e8ed}.glass .tab[aria-selected=true]{background:#ffffffbb}.underline .tabs{border-bottom:1px solid #ddd}.underline .tab,.indicator .tab{border-radius:0}.underline .tab[aria-selected=true],.indicator .tab[aria-selected=true],.icontext .tab[aria-selected=true]{color:#0066cc}.underline .tab[aria-selected=true]:after,.indicator .tab[aria-selected=true]:after{content:"";position:absolute;bottom:0;left:8px;right:8px;height:2px;background:#0071e3;border-radius:2px}.indicator .tab[aria-selected=true]:after{top:0;bottom:auto}.filled .tab[aria-selected=true]{background:#e1eafa;color:#0066cc}.icontext .tab{display:grid;justify-items:center;gap:4px}.panel{padding:12px 4px;color:#555;min-height:40px}.workspace{display:grid;grid-template-columns:minmax(60px,240px) minmax(0,1fr);gap:12px;margin:12px 0}.workspace .side{max-width:none}.workspace .content{background:#fff;border-radius:14px;padding:16px;min-width:0}.workspace.glass .content{background:#ffffffbb}.workspace.professional .side{background:#f8f8fa;border-right:1px solid #e5e5e9}.workspace.professional .content{border:1px solid #e5e5e9}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{background:#f5f5f7;border-radius:12px;padding:12px}.metric strong{display:block;font-size:24px}.chart{width:100%;margin-top:12px}.toggle{padding:8px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}@media(max-width:650px){.workspace{grid-template-columns:60px minmax(0,1fr)}.workspace .label,.workspace .group,.workspace .brandname{display:none}.workspace .navitem{justify-content:center}.workspace .side{padding:6px}.tab{padding:6px 8px}}@media(prefers-reduced-transparency:reduce){.glass .side,.glass .tabs,.workspace.glass .content{background:white;backdrop-filter:none}}
</style><main><h1>Apple Navigation Gallery</h1><p>6 种侧栏 · 8 种顶部标签 · 3 种组合工作台。原创 Web 近似示例。</p><h2>Sidebars</h2><div id="sides" class="gallery"></div><h2>Top tabs</h2><div id="tabs" class="gallery"></div><h2>Workspace layouts</h2><div id="layouts"></div></main><script>
const names=['Overview','Analytics','Models','Activity','Settings'],paths=['M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z','M4 20V12 M10 20V5 M16 20V9 M22 20V3','M12 2l9 5v10l-9 5-9-5V7z M3 7l9 5 9-5 M12 12v10','M2 12h5l3-8 4 16 3-8h5','M12 3v3 M12 18v3 M3 12h3 M18 12h3 M5 5l2 2 M17 17l2 2 M19 5l-2 2 M7 17l-2 2 M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8'];
const icon=i=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+paths[i%5]+'"/></svg>';
function side(){return '<aside class="side" aria-label="示例导航"><div class="brand">◈ <span class="brandname">Workspace</span></div><div class="group">GENERAL</div>'+names.map((n,i)=>'<button class="navitem" aria-label="'+n+'" title="'+n+'" aria-pressed="'+(i===0)+'">'+icon(i)+'<span class="label">'+n+'</span></button>').join('')+'</aside>'}
let seq=0;function tabs(){const id='tabs'+(++seq);return '<div class="tabs" role="tablist" aria-label="内容切换">'+['Overview','Models','Usage'].map((n,i)=>'<button class="tab" role="tab" id="'+id+'-'+i+'" aria-controls="'+id+'-panel" aria-selected="'+(i===0)+'" tabindex="'+(i===0?0:-1)+'">'+icon(i)+'<span>'+n+'</span></button>').join('')+'</div><div class="panel" role="tabpanel" tabindex="0" id="'+id+'-panel" aria-labelledby="'+id+'-0">Overview content</div>'}
const sides=[['classic','A · macOS Classic'],['floating','B · Floating'],['glass','C · Liquid Glass'],['dark','D · Dark Workspace'],['minimal','E · Minimal Accent'],['icons','F · Icon Rail']];
const ts=[['segmented','A · Segmented'],['pill','B · Floating Pill'],['underline','C · Underline'],['filled','D · Filled'],['glass','E · Glass'],['compact','F · Compact'],['icontext','G · Icon + Text'],['indicator','H · Top Indicator']];
document.querySelector('#sides').innerHTML=sides.map(([c,n])=>'<article class="card"><h3>'+n+'</h3><div class="scene '+c+'">'+side()+'</div></article>').join('');
document.querySelector('#tabs').innerHTML=ts.map(([c,n])=>'<article class="card"><h3>'+n+'</h3><div class="scene '+c+'">'+tabs()+'</div></article>').join('');
document.querySelector('#layouts').innerHTML=[['classic segmented','A · macOS Dashboard'],['glass pill','B · Glass Workspace'],['professional underline','C · Professional Workspace']].map(([c,n])=>'<article class="card"><h3>'+n+'</h3><button class="toggle" aria-expanded="true">折叠侧栏</button><div class="scene workspace '+c+'">'+side()+'<section class="content"><small>Workspace / Analytics</small><h2>Overview</h2>'+tabs()+'<div class="metrics"><div class="metric">Requests<strong>128K</strong></div><div class="metric">Success<strong>99.8%</strong></div></div><svg class="chart" viewBox="0 0 240 65" role="img" aria-label="模拟趋势"><path d="M0 55 L25 42 45 48 70 25 95 36 120 20 145 27 170 10 195 22 240 3" stroke="#6389c6" stroke-width="2" fill="none"/></svg></section></div></article>').join('');
document.querySelectorAll('.tabs:not(.icontext .tabs) .tab svg').forEach(e=>e.remove());
document.querySelectorAll('.side').forEach(s=>s.addEventListener('click',e=>{let b=e.target.closest('.navitem');if(!b)return;s.querySelectorAll('.navitem').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));let h=s.closest('.workspace')?.querySelector('.content h2');if(h)h.textContent=b.getAttribute('aria-label')}));
document.querySelectorAll('[role=tablist]').forEach(t=>{let bs=[...t.querySelectorAll('[role=tab]')],p=t.nextElementSibling;function select(b){bs.forEach(x=>{x.setAttribute('aria-selected',String(x===b));x.tabIndex=x===b?0:-1});p.setAttribute('aria-labelledby',b.id);p.textContent=b.textContent+' content'}t.onclick=e=>{let b=e.target.closest('[role=tab]');if(b)select(b)};t.onkeydown=e=>{let i=bs.indexOf(document.activeElement),j;if(i<0)return;if(e.key==='ArrowRight')j=(i+1)%bs.length;else if(e.key==='ArrowLeft')j=(i+bs.length-1)%bs.length;else if(e.key==='Home')j=0;else if(e.key==='End')j=bs.length-1;else return;e.preventDefault();select(bs[j]);bs[j].focus()}});
document.querySelectorAll('.toggle').forEach(b=>b.onclick=()=>{let w=b.nextElementSibling,c=w.classList.toggle('collapsed');w.style.gridTemplateColumns=c?'60px minmax(0,1fr)':'';b.setAttribute('aria-expanded',String(!c));b.textContent=c?'展开侧栏':'折叠侧栏'});
</script></html>
