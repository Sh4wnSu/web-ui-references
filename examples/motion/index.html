<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>动效对比</title><link rel="stylesheet" href="../../design-tokens/apple.css"><style> *{box-sizing:border-box}body{font-family:var(--font-sans);background:var(--bg);color:var(--text-primary);margin:0;padding:clamp(16px,4vw,48px)}h1,h2{letter-spacing:-.03em}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:999px;background:var(--accent);color:white;padding:12px 20px}button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.card{background:var(--surface);border-radius:24px;padding:24px} #shape{width:80px;height:80px;border-radius:24px;background:var(--accent);margin:48px auto}</style><h1>动效对比</h1><div class="card"><label>Motion <select id="m"><option>linear</option><option>ease</option><option>spring</option></select></label><div id="shape"></div><button id="play">播放</button></div><script>document.querySelector('#play').onclick=()=>{if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const m=document.querySelector('#m').value,e=document.querySelector('#shape');e.getAnimations().forEach(a=>a.cancel());e.animate(m==='spring'?[{transform:'scale(.45)'},{transform:'scale(1.13)',offset:.58},{transform:'scale(.97)',offset:.82},{transform:'scale(1)'}]:[{transform:'scale(.45)'},{transform:'scale(1)'}],{duration:400,easing:m==='linear'?'linear':'cubic-bezier(.22,1,.36,1)'})}</script></html>
