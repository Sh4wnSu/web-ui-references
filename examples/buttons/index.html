<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apple Button Gallery</title><link rel="stylesheet" href="../../design-tokens/buttons.css"><style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#f5f5f7;color:#1d1d1f;font:14px system-ui}main{max-width:1000px;margin:auto}h1{letter-spacing:-.04em}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px}article{background:white;border-radius:18px;padding:14px;min-width:0}h3{font-size:13px;margin:0 0 12px}.scene{min-height:90px;display:flex;align-items:center;justify-content:center;background:#f5f5f7;border-radius:12px;padding:10px;gap:8px;flex-wrap:wrap}.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;border-radius:999px;background:var(--button-web);color:white;font:500 14px system-ui;padding:10px 20px;cursor:pointer;touch-action:manipulation;transition:transform 350ms var(--button-ease),background var(--button-duration),box-shadow var(--button-duration);white-space:nowrap}.btn:active:not(:disabled){transform:scale(var(--button-press-scale))}.btn:focus-visible{outline:3px solid #78a9ec;outline-offset:3px}.btn:disabled{opacity:.55;cursor:default}.tinted{background:#e3edfc;color:#0066cc}.gray{background:#e5e5ea;color:#1d1d1f}.bordered{background:white;border-color:#0071e3;color:#0071e3}.plain{background:transparent;color:#0071e3}.danger{background:#d92d24}.softdanger{background:#fce7e7;color:#bc2626;border-radius:10px}.mac{border-radius:7px;padding:5px 14px;font-size:13px}.secondary{background:white;color:#1d1d1f;border-color:#d5d5da}.mono{background:#1d1d1f}.floating{background:white;color:#1d1d1f;box-shadow:0 4px 14px #0002}.glassscene{background:linear-gradient(135deg,#a3bedf,#d8b5d9)}.glass{background:#ffffff88;color:#30354a;border-color:#ffffffaa;backdrop-filter:blur(18px) saturate(150%);box-shadow:inset 0 1px 2px #fff,0 5px 15px #32425525}.glass:active:not(:disabled){transform:scale(var(--button-glass-scale));box-shadow:inset 0 1px 6px white,0 8px 24px #ffffff55}.prominent{background:#355d9ddd;color:white}.adaptive{background:#cddced;color:#314f76}.circle{width:42px;height:42px;padding:0;background:white;color:#0071e3;border-color:#ddd;font-size:22px}.iconlabel{background:#e7edf7;color:#345b94}.toolbar{background:#ededf1;color:#424245;border-radius:8px;padding:8px 12px}.pull{background:#e5e5ea;color:#1d1d1f;border-radius:10px}.large{border-radius:16px;min-height:52px;padding:12px 28px}.darkscene{background:#282a36}.darkglass{background:#ffffff25;color:white;border-color:#ffffff55}.group{display:flex;align-items:center;border-radius:12px;background:white;border:1px solid #ddd}.group .btn{border-radius:0;background:transparent;color:#424245;padding:8px 12px}.split{display:flex;background:#0071e3;border-radius:999px}.split .btn{background:transparent}.split .btn+ .btn{border-left:1px solid #ffffff55;border-radius:0 999px 999px 0;padding:10px}.menuwrap{position:relative}.menu{position:absolute;z-index:5;top:100%;right:0;min-width:130px;background:white;padding:6px;border:1px solid #ddd;border-radius:10px;box-shadow:0 8px 24px #0002}.menu button{display:block;width:100%;background:none;border:0;text-align:left;padding:8px;cursor:pointer}.menu button:hover{background:#eee}.lift:hover{transform:translateY(-3px);box-shadow:0 8px 24px #0002}.spot{background:#242733;overflow:hidden;--x:50%;--y:50%}.spot:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--x) var(--y),#ffffff55,transparent 60%);opacity:0;pointer-events:none;transition:opacity 150ms}.spot:hover:before,.spot:active:before{opacity:1}.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff5;border-top-color:white;border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.btn{transition:none;transform:none!important}.spin{animation:none}}@media(prefers-reduced-transparency:reduce){.glass{background:white;backdrop-filter:none}.prominent{background:#355d9d}.darkglass{background:#424450}}
</style><main><h1>Apple-inspired Buttons</h1><p>20 种样式 · 4 种组合 · 6 种动效。原创示例，点击仅模拟操作。</p><p id="status" aria-live="polite">Ready</p><h2>Styles</h2><div id="styles" class="grid"></div><h2>Groups</h2><div class="grid"><article><h3>Button Group</h3><div class="scene"><div class="group"><button class="btn" id="minus" aria-label="Zoom out">−</button><output id="zoom">100%</output><button class="btn" id="plus" aria-label="Zoom in">+</button></div></div></article><article><h3>Split Button</h3><div class="scene"><div class="menuwrap"><div class="split"><button class="btn">Run Agent</button><button class="btn" id="menuToggle" aria-label="Run options" aria-expanded="false" aria-controls="menu">⌄</button></div><div class="menu" id="menu" hidden><button>Run once</button><button>Run in background</button></div></div></div></article><article><h3>Glass Toolbar</h3><div class="scene glassscene"><div class="group glass"><button class="btn" aria-label="Back">←</button><button class="btn" aria-label="Forward">→</button><button class="btn" aria-label="Share">↗</button></div></div></article><article><h3>Action Pair</h3><div class="scene"><button class="btn gray">Cancel</button><button class="btn">Confirm</button></div></article></div><h2>Motion</h2><div class="grid"><article><h3>Press squash</h3><div class="scene"><button class="btn">Continue</button></div></article><article><h3>Spring-like bounce</h3><div class="scene"><button class="btn tinted" id="bounce">Tap me</button></div></article><article><h3>Glass press</h3><div class="scene glassscene"><button class="btn glass">Explore</button></div></article><article><h3>Floating lift</h3><div class="scene"><button class="btn floating lift">Hover me</button></div></article><article><h3>Pointer light</h3><div class="scene"><button class="btn spot">Spotlight</button></div></article><article><h3>Async state</h3><div class="scene"><button class="btn" id="async">Run task</button></div></article></div><h2>States</h2><div class="scene"><button class="btn">Default</button><button class="btn" disabled>Disabled</button><button class="btn" style="background:#237c48">✓ Success</button><button class="btn danger">Retry</button></div></main><script>
const styles=[['A · Filled','','Continue'],['B · Tinted','tinted','Continue'],['C · Gray','gray','Cancel'],['D · Bordered','bordered','Learn more'],['E · Plain','plain','Learn more ›'],['F · Destructive','danger','Delete'],['G · Soft destructive','softdanger','Remove'],['H · macOS rounded','mac','Done'],['I · macOS secondary','mac secondary','Cancel'],['J · Monochrome','mono','Get started'],['K · Floating white','floating','Explore'],['L · Frosted glass','glass','Continue'],['M · Prominent glass','glass prominent','Get started'],['N · Adaptive tint','adaptive','Play'],['O · Circular icon','circle','+','Add'],['P · Icon + label','iconlabel','↗ Share'],['Q · Toolbar','toolbar','⚙','Settings'],['R · Pull-down','pull','Options ⌄'],['S · Large CTA','large','Continue'],['T · Dark glass','glass darkglass','Continue']];document.querySelector('#styles').innerHTML=styles.map(([n,c,l,a],i)=>'<article><h3>'+n+'</h3><div class="scene '+([11,12].includes(i)?'glassscene':i===19?'darkscene':'')+'"><button class="btn '+c+'" '+(a?'aria-label="'+a+'"':'')+'>'+l+'</button></div></article>').join('');
const $=id=>document.getElementById(id),say=s=>$('status').textContent=s,reduce=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;document.querySelectorAll('.btn:not(#async):not(#menuToggle):not(#plus):not(#minus)').forEach(b=>b.addEventListener('click',()=>say((b.getAttribute('aria-label')||b.textContent)+' · simulated click')));let z=100;for(const [id,d] of [['minus',-10],['plus',10]])$(id).onclick=()=>{z=Math.max(50,Math.min(200,z+d));$('zoom').value=z+'%'};function menu(open){$('menu').hidden=!open;$('menuToggle').setAttribute('aria-expanded',String(open))}$('menuToggle').onclick=()=>menu($('menu').hidden);$('menu').onclick=e=>{if(e.target.tagName==='BUTTON'){say(e.target.textContent+' · simulated');menu(false);$('menuToggle').focus()}};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('menu').hidden){menu(false);$('menuToggle').focus()}});document.addEventListener('click',e=>{if(!e.target.closest('.menuwrap'))menu(false)});$('bounce').onclick=()=>{if(!reduce()){$('bounce').getAnimations().forEach(a=>a.cancel());$('bounce').animate([{transform:'scale(.94)'},{transform:'scale(1.045)',offset:.5},{transform:'scale(.992)',offset:.78},{transform:'scale(1)'}],{duration:440,easing:'ease-out'})}};document.querySelector('.spot').onpointermove=e=>{let b=e.currentTarget,r=b.getBoundingClientRect();b.style.setProperty('--x',e.clientX-r.left+'px');b.style.setProperty('--y',e.clientY-r.top+'px')};$('async').onclick=()=>{let b=$('async');b.disabled=true;b.setAttribute('aria-busy','true');b.innerHTML='<span class="spin" aria-hidden="true"></span>Running';say('模拟任务运行中');setTimeout(()=>{b.textContent='✓ Completed';b.style.background='#237c48';b.setAttribute('aria-busy','false');say('模拟任务完成');setTimeout(()=>{b.disabled=false;b.textContent='Run task';b.style.background=''},1300)},900)};
</script></html>
