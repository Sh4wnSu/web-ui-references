<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bento Grid</title><link rel="stylesheet" href="../../design-tokens/apple.css"><style> *{box-sizing:border-box}body{font-family:var(--font-sans);background:var(--bg);color:var(--text-primary);margin:0;padding:clamp(16px,4vw,48px)}h1,h2{letter-spacing:-.03em}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:999px;background:var(--accent);color:white;padding:12px 20px}button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.card{background:var(--surface);border-radius:24px;padding:24px} main{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:900px}.big{grid-column:span 2}.big h2{font-size:clamp(32px,6vw,64px)}.tall{grid-row:span 2;background:#1d1d1f;color:white}@media(max-width:600px){main{grid-template-columns:1fr}.big,.tall{grid-column:auto;grid-row:auto}}</style><h1>Bento Grid</h1><main><article class="card big"><small>Performance</small><h2>Powerful.<br>By design.</h2></article><article class="card"><h2>2×</h2>Faster</article><article class="card tall"><h2>All day.</h2>Battery life</article><article class="card"><h2>32 GB</h2>Memory</article><article class="card"><h2>Ultra</h2>Efficiency</article></main><script></script></html>
