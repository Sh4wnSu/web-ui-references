<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>连续圆角</title><link rel="stylesheet" href="../../design-tokens/apple.css"><style> *{box-sizing:border-box}body{font-family:var(--font-sans);background:var(--bg);color:var(--text-primary);margin:0;padding:clamp(16px,4vw,48px)}h1,h2{letter-spacing:-.03em}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:999px;background:var(--accent);color:white;padding:12px 20px}button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.card{background:var(--surface);border-radius:24px;padding:24px} .row{display:flex;flex-wrap:wrap;gap:24px;align-items:center}.shape{width:200px;height:200px;border-radius:40px;background:#0071e3;color:white;display:grid;place-items:center}.outer{background:#ddd;padding:12px;border-radius:32px;max-width:280px}.inner{background:white;border-radius:20px;padding:40px}</style><h1>连续圆角</h1><div class="row"><div class="shape">圆弧</div><svg viewBox="0 0 200 200" width="200" height="200"><path id="p" fill="#0071e3"/></svg></div><label>超椭圆指数 <output id="o">4</output><input id="n" type="range" min="2" max="10" step=".1" value="4"></label><h2>同心嵌套</h2><div class="outer"><div class="inner">32 − 12 = 20px</div></div><script>const n=document.querySelector('#n'),p=document.querySelector('#p'),o=document.querySelector('#o');function draw(){o.value=n.value;p.setAttribute('d',Array.from({length:361},(_,i)=>{let t=i*Math.PI/180,c=Math.cos(t),s=Math.sin(t);return (i?'L':'M')+(100+98*Math.sign(c)*Math.pow(Math.abs(c),2/n.value))+' '+(100+98*Math.sign(s)*Math.pow(Math.abs(s),2/n.value))}).join(' ')+'Z')}n.oninput=draw;draw();</script></html>
