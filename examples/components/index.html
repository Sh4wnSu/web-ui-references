<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>基础组件</title><link rel="stylesheet" href="../../design-tokens/apple.css"><style> *{box-sizing:border-box}body{font-family:var(--font-sans);background:var(--bg);color:var(--text-primary);margin:0;padding:clamp(16px,4vw,48px)}h1,h2{letter-spacing:-.03em}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:999px;background:var(--accent);color:white;padding:12px 20px}button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.card{background:var(--surface);border-radius:24px;padding:24px} input[type=search]{padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--bg)}.secondary{background:var(--surface-secondary);color:var(--accent)}fieldset{border:1px solid var(--border);border-radius:12px}dialog{border:0;border-radius:24px;padding:32px;box-shadow:var(--shadow-lg)}input{accent-color:var(--accent)}</style><h1>基础组件</h1><section class="card"><button>Continue</button> <button class="secondary">Secondary</button><p><label>Search <input type="search" placeholder="Search anything"></label></p><fieldset><legend>Period</legend><label><input type="radio" name="period" checked>Day</label> <label><input type="radio" name="period">Week</label> <label><input type="radio" name="period">Month</label></fieldset><p><label>Wi-Fi <input type="checkbox" role="switch" checked></label></p><p><label>Brightness <input type="range"></label></p><p><label>Automatic updates <input type="checkbox" checked></label></p><button onclick="document.querySelector('dialog').showModal()">Open dialog</button><dialog><h2>Settings</h2><form method="dialog"><button>Done</button></form></dialog></section><script></script></html>
