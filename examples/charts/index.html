<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apple Chart Gallery</title><link rel="stylesheet" href="../../design-tokens/apple.css"><link rel="stylesheet" href="../../design-tokens/charts.css"><style>*{box-sizing:border-box}body{font:16px system-ui;background:var(--bg);color:var(--text-primary);padding:24px;margin:0}main{max-width:1200px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px}article{background:var(--surface);padding:24px;border-radius:20px}svg{width:100%;height:auto}h2{font-size:18px}small{color:var(--chart-axis)}strong{font-size:32px;font-variant-numeric:tabular-nums}button{font:inherit;padding:10px 16px;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:inherit}svg text{fill:var(--text-primary);font-size:10px}</style><main><h1>Apple-inspired Chart Gallery</h1><p>模拟数据 · 原生 SVG · 设计参考</p><button id="theme">切换深浅色</button><div class="grid" id="grid"></div></main><script>
const colors=['#6389c6','#68a68c','#9c85be','#d5a16b','#cc7882'],v=[32,54,43,72,62,85,74],line=v.map((n,i)=>(10+i*43)+','+(110-n)).join(' '),grid=[20,50,80,110].map(y=>'<path d="M0 '+y+' H280" stroke="currentColor" opacity=".1" stroke-dasharray="3 3"/>').join('');
const rect=(x,y,w,h,c,r=3)=>'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+r+'" fill="'+c+'"/>';
const circle=(x,y,r,c)=>'<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+c+'"/>';
const charts=[
['KPI + Sparkline','128.4K','<polyline points="'+line+'" fill="none" stroke="'+colors[0]+'" stroke-width="2"/>'],
['Line Chart','86.4 tokens/s',grid+'<polyline points="'+line+'" fill="none" stroke="'+colors[0]+'" stroke-width="2"/>'],
['Area Chart','24.8M',grid+'<polygon points="10,110 '+line+' 268,110" fill="'+colors[0]+'" opacity=".18"/><polyline points="'+line+'" fill="none" stroke="'+colors[0]+'" stroke-width="2"/>'],
['Column Chart','Daily requests',grid+v.map((n,i)=>rect(10+i*39,110-n,23,n,colors[0])).join('')],
['Stacked Bar','Model usage',grid+v.map((n,i)=>rect(10+i*39,110-n*.6,23,n*.6,colors[0])+rect(10+i*39,110-n,23,n*.4-1,colors[2])).join('')],
['Capacity Bar','36.8 / 48 GB',[24,8,4.8,11.2].map((n,i,a)=>rect(a.slice(0,i).reduce((s,x)=>s+x,0)/48*280,40,n/48*280-2,24,colors[i])).join('')],
['Progress Ring','76%','<circle cx="140" cy="60" r="45" stroke="'+colors[0]+'" opacity=".15" stroke-width="12" fill="none"/><circle cx="140" cy="60" r="45" pathLength="100" stroke="'+colors[0]+'" stroke-width="12" stroke-dasharray="76 100" stroke-linecap="round" fill="none" transform="rotate(-90 140 60)"/>'],
['Activity Rings','86% / 72% / 93%',[45,32,19].map((r,i)=>'<circle cx="140" cy="60" r="'+r+'" stroke="'+colors[i]+'" opacity=".15" stroke-width="9" fill="none"/><circle cx="140" cy="60" r="'+r+'" pathLength="100" stroke="'+colors[i]+'" stroke-width="9" stroke-dasharray="'+[86,72,93][i]+' 100" stroke-linecap="round" fill="none" transform="rotate(-90 140 60)"/>').join('')],
['Range Bar','Latency ranges',v.slice(0,5).map((n,i)=>rect(10,10+i*22,260,7,'#a7a7b133')+rect(n*.8,10+i*22,n*2,7,colors[0])+circle(n*1.8,13.5+i*22,4,'white')).join('')],
['Histogram','Latency distribution',[8,20,42,70,85,68,40,22,9].map((n,i)=>rect(5+i*30,110-n,29,n,colors[0],0)).join('')],
['Calendar Heatmap','Daily activity',Array.from({length:140},(_,i)=>'<rect x="'+(5+Math.floor(i/7)*13)+'" y="'+(8+i%7*14)+'" width="11" height="11" rx="2" fill="'+colors[1]+'" opacity="'+[.12,.3,.5,.75,1][(i*17+Math.floor(i/9))%5]+'"/>').join('')],
['Scatter Plot','Cost vs throughput',Array.from({length:30},(_,i)=>circle(10+i*37%260,Math.max(8,Math.min(110,105-(i*37%260)*.3+Math.sin(i*4)*20)),3,colors[0])).join('')],
['Box Plot','Latency quartiles',[60,140,220].map((x,i)=>'<path d="M'+x+' 12 V108 M'+(x-9)+' 12 h18 M'+(x-9)+' 108 h18" stroke="'+colors[0]+'"/>'+rect(x-18,30+i*5,36,42-i*4,colors[0])+'<path d="M'+(x-18)+' '+(48+i*5)+' h36" stroke="white"/>').join('')],
['Bullet Chart','Actual vs target',rect(5,35,270,30,'#a7a7b133')+rect(5,35,180,30,'#a7a7b155')+rect(5,44,195,12,colors[0])+'<path d="M230 29 V71" stroke="currentColor" stroke-width="2"/>'],
['State Timeline','Service status',Array.from({length:24},(_,i)=>rect(5+i%8*34,10+Math.floor(i/8)*30,32,20,colors[[1,1,3,1,4,1,1,1][(i+Math.floor(i/8))%8]],2)).join('')],
['Donut Chart','Model distribution',[55,30,15].map((n,i,a)=>'<circle cx="140" cy="60" r="42" pathLength="100" stroke="'+colors[i]+'" stroke-width="18" stroke-dasharray="'+(n-1)+' '+(101-n)+'" stroke-dashoffset="'+(-a.slice(0,i).reduce((s,x)=>s+x,0))+'" transform="rotate(-90 140 60)" fill="none"/>').join('')]
];document.querySelector('#grid').innerHTML=charts.map(([n,d,s])=>'<article><h2>'+n+'</h2><small>'+d+'</small><svg viewBox="0 0 280 120" role="img" aria-label="'+n+' illustrative chart">'+s+'</svg></article>').join('');document.querySelector('#theme').onclick=()=>document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';
</script></html>
