<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>App Icon Lab</title><style>body{font:14px system-ui;background:#f5f5f7;color:#1d1d1f;padding:24px}main{max-width:1000px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:14px}.item{border:0;background:white;border-radius:16px;padding:12px;display:grid;justify-items:center;gap:8px;cursor:pointer}.item img{width:var(--size,64px);max-width:100%}label{display:inline-block;margin:6px}button,select,input{font:inherit}button:focus-visible{outline:2px solid #0071e3}.preview{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px;background:linear-gradient(135deg,#b7cbed,#e6c9d9);border-radius:20px}.preview img{width:100px;height:100px}</style><main><h1>Apple-inspired App Icons</h1><p>50 glyphs · 10 materials · fixed silhouette</p><label>Material <select id="variant"></select></label><label>Search <input id="search" type="search"></label><label>Size <input id="size" type="range" min="24" max="96" value="64"></label><div id="grid" class="grid"></div><h2>Export selected icon</h2><div class="preview"><img id="preview" alt="Selected icon"><span id="name"></span><label>Top <input id="top" type="color"></label><label>Bottom <input id="bottom" type="color"></label><label>PNG size <select id="pngsize"><option>128</option><option>256</option><option>512</option><option selected>1024</option></select></label><button id="svg">Export SVG</button><button id="png">Export PNG</button></div><p id="status" role="status"></p></main><script src="generator.js"></script><script>const $=id=>document.getElementById(id);$('variant').innerHTML=VARIANTS.map(v=>'<option>'+v+'</option>').join('');let selected=ICONS[0],url;function preview(){if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(new Blob([renderIcon({...selected,colors:[$('top').value,$('bottom').value]},$('variant').value)],{type:'image/svg+xml'}));$('preview').src=url;$('name').textContent=selected.id}function choose(i){selected=ICONS[i];$('top').value=selected.colors[0];$('bottom').value=selected.colors[1];preview()}function draw(){ $('grid').innerHTML=ICONS.map((a,i)=>a.id.includes($('search').value.toLowerCase())?'<button class="item" data-i="'+i+'"><img alt="" src="../../assets/app-icons/'+$('variant').value+'/'+a.id+'.svg">'+a.id+'</button>':'').join('');preview()}$('grid').onclick=e=>{const b=e.target.closest('[data-i]');if(b)choose(+b.dataset.i)};$('variant').onchange=draw;$('search').oninput=draw;$('size').oninput=e=>$('grid').style.setProperty('--size',e.target.value+'px');$('top').oninput=$('bottom').oninput=preview;function download(blob,ext){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=selected.id+'-'+$('variant').value.replace('/','-')+'.'+ext;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}$('svg').onclick=()=>download(new Blob([renderIcon({...selected,colors:[$('top').value,$('bottom').value]},$('variant').value)],{type:'image/svg+xml'}),'svg');$('png').onclick=async()=>{try{let im=new Image();im.src=url;await im.decode();let c=document.createElement('canvas');c.width=c.height=+$('pngsize').value;c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>{if(b)download(b,'png');else $('status').textContent='PNG export failed'},'image/png')}catch(e){$('status').textContent='PNG export failed'}};choose(0);draw();</script></html>
