<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>玻璃材质近似</title><link rel="stylesheet" href="../../design-tokens/apple.css"><style> *{box-sizing:border-box}body{font-family:var(--font-sans);background:var(--bg);color:var(--text-primary);margin:0;padding:clamp(16px,4vw,48px)}h1,h2{letter-spacing:-.03em}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:999px;background:var(--accent);color:white;padding:12px 20px}button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.card{background:var(--surface);border-radius:24px;padding:24px} .scene{padding:60px 24px;background:radial-gradient(circle at 20% 30%,#6495ed 0 20%,transparent 21%),radial-gradient(circle at 80% 80%,#f68 0 25%,transparent 26%),linear-gradient(120deg,#bde,#fbd);border-radius:32px}#glass{max-width:420px;margin:auto;border:1px solid #ffffff80;box-shadow:var(--shadow-lg)}</style><h1>玻璃材质近似</h1><div class="scene"><div id="glass" class="card"><h2>Clear by nature.</h2>CSS 毛玻璃，不是真实折射。</div></div><p><label>Blur <input id="b" type="range" min="0" max="40" value="20"></label></p><p><label>Opacity <input id="a" type="range" min="5" max="95" value="65"></label></p><p><label>Saturation <input id="s" type="range" min="80" max="220" value="160"></label></p><script>const g=document.querySelector('#glass'),b=document.querySelector('#b'),a=document.querySelector('#a'),s=document.querySelector('#s');function draw(){g.style.background='rgba(255,255,255,'+a.value/100+')';g.style.backdropFilter='blur('+b.value+'px) saturate('+s.value+'%)'}[b,a,s].forEach(e=>e.oninput=draw);draw();</script></html>
